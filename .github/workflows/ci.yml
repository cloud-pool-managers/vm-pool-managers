name: CI

# This repository had no CI at all.
#
# The GOOS list below was measured on this module, not copied: every pair was
# cross-built locally first, and `go test -race` was run. A matrix written
# from a template rather than from measurement lands red on its first run, and
# a red lane nobody reads is how a sibling repo (weft-microvm-agent) kept a
# broken linux build for weeks while darwin and the BSDs went green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - control_center
          - microservices/openstack
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - control_center
          - microservices/openstack
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - control_center
          - microservices/openstack
        goos:
          - linux
          - darwin
          - freebsd
          - openbsd
          - netbsd
          - windows
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  # The frontend was not built here at all, and that is how it came to sit
  # unbuildable on main: #22 took typescript to 7, no job installed the tree
  # afterwards, and `npm install` has failed ERESOLVE ever since -- which is
  # also why every Renovate pull request since then reports "Artifact file
  # update failure" and carries no npm change at all.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 1. PROVES: package.json and package-lock.json agree, and the tree
      #    resolves. `npm ci` refuses on either failure, which is exactly how
      #    a bump that the peer ranges do not admit shows up.
      - name: npm ci
        run: npm ci

      # 2. PROVES: the application still builds.
      - name: build
        run: npm run build

      # 3. PROVES: svelte-check finds no type error.
      - name: check
        run: npm run check
